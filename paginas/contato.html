<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/contato.css" />
    <title>Azarii Loads | Site oficial</title>
    <!-- Icone do navegador-->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇️</text></svg>"
    />
  </head>
  <body class="pagina-contato">
    <section>
      <h2 id="textocontato">Entre em Contato</h2>
      <p id="textosugestivo">
        Tem sugestões para o site, quer tirar dúvidas ou feedback? Fale conosco.
      </p>

      <form>
        <div class="caixanome">
          <label>Nome Completo *</label>
          <input type="text" placeholder="Seu nome" autocomplete="name" />
        </div>

        <div class="caixaemail">
          <label>E-mail *</label>
          <input
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
          />
        </div>

        <div class="caixassunto">
          <label>Assunto *</label>
          <select>
            <option>Selecione um assunto</option>
            <option>Sugestão</option>
            <option>Dúvida</option>
            <option>Feedback</option>
          </select>
        </div>

        <div class="caixamensagem">
          <label>Mensagem *</label>
          <textarea placeholder="Escreva sua mensagem aqui..."></textarea>
        </div>

        <button type="submit">Enviar mensagem</button>
      </form>
    </section>
    <footer class="rodape">
      <div class="rodape-content">
        <p>&copy; 2026 Azarii. Todos os direitos reservados.</p>
        <nav>
          <a href="privacidade.html">Privacidade</a>
        </nav>
      </div>
    </footer>
    <script src="../javascript/index.js"></script>
    <script src="../javascript/contato.js"></script>
  </body>
</html>
